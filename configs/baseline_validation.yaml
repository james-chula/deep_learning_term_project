# Colab-T4 validation-only configuration. Change only declared parameters per experiment.
data_root: .data/medmnist
output_dir: artifacts/baseline_results
# The repository's fixed stratified 1% training index manifest.
subset_manifest: splits/bloodmnist_train_1pct_seed2026.npz
train_subset: 100pct  # allowed: 1pct, 100pct
evaluation_split: val
run_test_evaluation: false
require_cuda: true
require_t4: true
seed: 2026
batch_size: 128
num_workers: 2
linear_probe:
  # Fixed values for the required baseline; do not tune against the test split.
  C: 1.0
  max_iter: 1000
